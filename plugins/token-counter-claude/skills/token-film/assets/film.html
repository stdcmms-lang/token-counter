function formatUnit(unit){return unit===1?'1 token':unit===1000000?'1 million tokens':`${grouped(unit)} tokens`;}

function niceAbove(value){let p=1;while(5*p<=value)p*=10;for(const n of [1,2,5,10])if(n*p>Math.max(0,value))return n*p;}

function compactStart(m,index){return m.SPANS.find(sp=>sp.kind==='compact'&&sp.index===index).start;}
